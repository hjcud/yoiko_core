# Gradle 명령의 기본 메모리를 설정합니다. 사용자 설정이나 명령줄 속성으로 덮어쓸 수 있습니다.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# 자세한 내용: https://github.com/neoforged/ModDevGradle?tab=readme-ov-file#better-minecraft-parameter-names--javadoc-parchment
# 최신 버전 확인: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
# 환경 속성
# 최신 버전 확인: https://projects.neoforged.net/neoforged/neoforge
# 올바른 산출물을 만들려면 마인크래프트 버전과 NeoForge 버전이 호환되어야 합니다.
minecraft_version=1.21.1
# 마인크래프트 버전 범위의 경계에는 정식 출시 버전을 사용할 수 있습니다.
# 스냅숏, 사전 출시 및 출시 후보 버전은 표준 버전 규칙을 따르지 않아 올바른 정렬을 보장하지 않습니다.
minecraft_version_range=[1.21.1]
# 올바른 산출물을 만들려면 NeoForge 버전과 마인크래프트 버전이 호환되어야 합니다.
neo_version=21.1.234
# 로더 버전 범위의 경계에는 FML 주 버전만 사용할 수 있습니다.
loader_version_range=[1,)

## 모드 속성

# 모드의 고유 식별자입니다. 영문 소문자로 시작하고 정규식 [a-z][a-z0-9_]{1,63}을 만족해야 합니다.
# @Mod가 지정된 주 모드 클래스의 문자열 상수와 일치해야 합니다.
mod_id=yoiko_core
# 화면에 표시할 모드 이름입니다.
mod_name=요이코 서버 코어
# 모드 라이선스입니다. 선택지는 https://choosealicense.com/ 에서 확인할 수 있으며 기본값은 모든 권리 보유입니다.
mod_license=모든 권리 보유
# 모드 버전입니다. https://semver.org/ 를 참고하십시오.
mod_version=1.1.0
# 모드 그룹 식별자이며 Maven 저장소에 산출물을 게시할 때 사용합니다.
# 모드 소스의 기본 패키지와 일치해야 합니다.
# 참고: https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.yoiko.core
